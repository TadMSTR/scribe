[project]
name = "scribe"
version = "0.12.0"
description = "Deterministic Claude Code transcript extractor and session summarizer"
readme = "README.md"
# SPDX string, not the `{ text = ... }` table: setuptools deprecated the table with a removal
# date of 2027-02-18, and the deploy builds with isolation, so it always gets the newest
# setuptools (vikunja#964). The string form needs setuptools>=77; the build floor is above it.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# `scribe.extract` is stdlib-only and must stay that way — it is the one component that is
# provably offline, and it is the one that reads raw transcripts. That invariant is enforced
# by `tests/test_stdlib_only.py`, which walks the module's imports, rather than by keeping
# httpx out of this list: a packaging convention is not a guarantee, and an AST check is.
# Bounded, not a bare floor. `httpx>=0.27` was the exact shape of vikunja#627 — an
# unbounded floor that let `fastmcp>=2.0` resolve to 4.0.1, two majors past anything tested,
# unobserved for ten days. The ceiling is chosen the same way the `telemetry` extra below
# chooses its `<2`: the boundary past which the API contract this code relies on may change.
#
# For a 0.x package that boundary is the MINOR, by convention, so `<0.29` rather than `<1`.
# Measured 2026-09-18: exactly one httpx API is used anywhere in this repo —
# `httpx.post(url, json=, headers=, timeout=)` at summarize/providers.py:99, plus
# `.status_code` and `.json()` on the response. Deployed on forge is 0.28.1, which is also
# the newest real release; 1.0 exists only as dev builds. So this bound excludes nothing
# that exists today, and a 0.29 is a deliberate reading task rather than a silent bump.
dependencies = [
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
# Spans are emitted only when BOTH of these are true: this extra is installed, and
# `OTEL_EXPORTER_OTLP_ENDPOINT` is set. Neither alone does anything, and the failure mode
# of getting it half-right is silence -- vikunja#336 (endpoint set, extra never installed,
# telemetry dead for two months) and vikunja#579 (extras not part of venv-deploy, so a
# redeploy dropped them again). `setup_tracing()` prints to stderr when the endpoint is set
# and the import fails, so the half-configured case is noisy rather than silent.
#
# gRPC rather than HTTP, and that is not arbitrary: forge's `OTEL_EXPORTER_OTLP_ENDPOINT` is
# `http://127.0.0.1:4317`, which is the collector's gRPC port, and the three sibling venvs
# that have working telemetry (githost-mcp, datastore-mcp, scoped-mcp) all carry the
# proto-grpc exporter. The floor is 1.42 because that is the oldest version deployed on
# forge today; the `<2` ceiling is because the 1.x span API is what these call sites use.
telemetry = [
    "opentelemetry-api>=1.45.0,<2",
    "opentelemetry-sdk>=1.42,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Pinned exactly, not >=. `ruff format --check` is a CI gate and two patch releases can
    # disagree about whitespace, which turns an unrelated PR red for a reason nobody
    # changed. Taking a bump is a decision, not a default. Keep it on the same version as
    # the other repos in the fleet, so a shared bump moves together; the version is not
    # restated here because a comment naming it goes stale on the first bump.
    "ruff==0.16.8",
]

[project.scripts]
scribe-extract = "scribe.extract.__main__:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["scribe"]
branch = true

[tool.coverage.report]
# Measured 2026-09-13 on the Phase 1 tree at 96%. Set at 90 to leave headroom for the
# Phase 3 summarizer landing with its own tests rather than forcing the floor down later.
fail_under = 90
show_missing = true

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
# Fixtures and contract tests contain synthetic credential literals on purpose; flagging
# them as hardcoded secrets would mean the only way to test redaction is to disable the
# secret scanner, which is the wrong trade.
# S105-S107: synthetic credential literals, see above.
# S108: `/tmp/...` appears as fixture DATA describing a transcript that mentions a
# path — no test here writes to it. Real temporary files use the tmp_path fixture.
"tests/*" = ["S105", "S106", "S107", "S108"]
