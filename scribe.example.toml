# scribe configuration. Copy to scribe.toml and edit.

[extract]
quiet_period_minutes = 15
# Byte budget before degradation. Measured across a 429-transcript corpus: at 200000, 74%
# of sessions need no degradation at all and the largest reaches ~68K tokens, which fits
# mistral-small's context with room for the prompt. This is a CONTEXT-WINDOW control, not a
# cost control -- post-extraction the whole corpus summarizes for ~$2/month.
max_session_bytes = 200000

[discovery]
project_globs = ["~/.claude/projects/*/"]
exclude       = [".memsearch"]
state_path    = "~/.local/state/scribe/scribe.sqlite3"
output_dir    = "~/.local/share/scribe/digests"
# The per-session event logs — the drill-down tier behind each digest. Written before the
# summarization call, so a failed model call still leaves the evidence of what it saw.
#
# Keep this a SIBLING of output_dir, never a child. Digests are meant to be indexed by
# whatever indexer you run (on forge, a qmd collection that globs `<output_dir>/**/*.md`);
# event logs must not be, because they are evidence reached *from* a digest rather than a
# search target, and ~39 MB of tool arguments would swamp the digest signal in every
# semantic query. Nesting them under output_dir is what would quietly undo that.
eventlog_dir  = "~/.local/share/scribe/eventlogs"
# YAML frontmatter (agent, date, source, session_ids) at the top of each daily digest, for
# indexers that read it. The per-block anchors are unchanged either way.
# emit_frontmatter = false

# For push indexers -- ones that must be told what changed rather than globbing a
# directory. See README, "Using a different indexer". Everything here is optional; with no
# [index] block scribe still appends to the manifest and runs no hook.
[index]
# Append-only manifest, one line per block written. Default is a sibling of output_dir.
# Refused if it resolves inside output_dir or eventlog_dir.
# manifest_path = "~/.local/share/scribe/index.jsonl"
#
# An ARGV LIST, run without a shell, once per written digest, with the digest's path
# appended. A string is refused at load: the path derives from an external agent name.
# on_digest_written = ["/usr/local/bin/my-indexer", "--file"]
# on_digest_written_timeout_seconds = 30
# The hook does NOT inherit scribe's environment -- which holds the summarizer's API key. It
# gets PATH, HOME, USER, LOGNAME, LANG, LC_ALL, LC_CTYPE, TZ, TMPDIR, plus exact names here.
# on_digest_written_env = ["MY_INDEXER_TOKEN"]

[summarize.session]
# Post-extraction the task is formatting a structured log, not inference, so `small` is
# sufficient and ~10x cheaper than `medium`. It also keeps the GPU free.
provider = "mistral"
model    = "mistral-small-latest"

[summarize.daily]
# Low volume (~1 per agent per day) and the one place cross-session synthesis matters.
provider = "claude-cli"

[providers.mistral]
type     = "openai-compatible"
base_url = "https://api.mistral.ai/v1"
# An env REFERENCE, never a literal. scribe refuses to load a config with a literal value:
# documenting the rule is what was in place when a live key was committed once already.
api_key  = { env = "MISTRAL_API_KEY" }

[providers.ollama]
type     = "openai-compatible"
base_url = "http://127.0.0.1:11435/v1"   # ollama-queue-proxy
api_key  = { env = "OLLAMA_API_KEY" }
model    = "summarize:latest"

[providers.claude-cli]
type = "claude-cli"

[service]
host = "127.0.0.1"
port = 8499
