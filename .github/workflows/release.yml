name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege at the workflow level, escalated PER JOB below. Only `create-github-release`
# writes anything back to the repository; `build` runs `python -m build` on the checked-out
# tree and `verify` installs a wheel into a throwaway venv. Neither has any business holding
# `contents: write`. This is OSSF Scorecard's Token-Permissions check, and the per-job shape is
# what part 4 of this programme will be reading when scribe goes public.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  # BETWEEN BUILD AND ATTACH, DELIBERATELY.
  #
  # All eight releases before this workflow existed (v0.1.0 -> v0.7.0) were cut by hand, and
  # nothing ever asserted anything about the artefact attached to them. ci.yml verifies the
  # distribution on every PR; the release path — the one nobody reviews, because by then the
  # tag is already pushed — verified nothing.
  #
  # The tag is passed with its leading `v` stripped, which is the assertion the PR path cannot
  # make: the job that attaches is not the job that built, and it trusts a downloaded artifact.
  # Without it, a tag and an artefact that disagree would be attached silently.
  verify:
    name: Verify distribution
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Checked out because the verification script lives here. The attach job below does not
      # need it and therefore does not check out.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Verify distribution against the tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: .github/ci/verify-dist.sh dist "${TAG_NAME#v}"

  # ATTACH TO AN AUTHORED RELEASE. DO NOT WRITE THE NOTES.
  #
  # This is the one place this workflow deliberately diverges from the fleet's exemplar, which
  # calls `gh release create --generate-notes`. scribe's eight release titles are hand-written
  # and each names the finding the release fixes:
  #
  #     v0.7.0 — a cap chosen from last month's corpus decays silently
  #     v0.6.0 — the compaction recap is not user text
  #
  # A commit-log generator produces nothing like that, and a workflow that overwrote them would
  # quietly replace the most useful thing about this project's release history with a changelog
  # nobody reads.
  #
  # So the contract is: the human writes the release and its notes, then pushes the tag; this
  # job attaches the verified artefacts to it. `--notes-from-tag`-style generation is not used,
  # and the create path below is a FALLBACK that writes a deliberately bare placeholder telling
  # the operator to fill it in — it does not invent prose.
  #
  # THE FALLBACK CREATES A DRAFT (audit finding, 2026-09-18, Low). It previously published.
  # Reaching that branch means a `v*` tag was pushed with no release written for it, which is a
  # process slip — and once part 4 of this programme flips this repo public, publishing on a
  # slip puts an unfinished-looking release on the internet within the same workflow run. A
  # mistyped tag or a stray `git push --tags` is enough.
  #
  # Draft rather than hard-fail, deliberately: failing would discard a build that has already
  # passed `verify`, so a tagging mistake would cost the artefact too. A draft keeps the
  # verified artefacts attached and reviewable, costs nothing, and is invisible until someone
  # writes the notes and presses publish. Drafts remain visible to `gh release view`, so a
  # re-run of this job takes the `--clobber` path above rather than creating a second one.
  create-github-release:
    name: Attach artifacts to the release
    runs-on: ubuntu-latest
    needs: [build, verify]
    permissions:
      contents: write  # the only job that needs it — required for `gh release`

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            # The intended path: the release already exists with authored notes.
            echo "Release ${TAG_NAME} exists — attaching artifacts to it."
            gh release upload "${TAG_NAME}" dist/*.whl dist/*.tar.gz --clobber
          else
            # Fallback. Reaching here means a tag was pushed before the release was written,
            # which is a process slip rather than an error — the artefacts are verified either
            # way and losing them would be worse. The notes say exactly what happened so the
            # gap is visible in the release list rather than looking finished.
            echo "::warning::Release ${TAG_NAME} does not exist. Creating it as a DRAFT with" \
                 "placeholder notes and attaching artifacts. Write the notes by hand and" \
                 "publish it — this workflow does not generate notes and does not publish."
            gh release create "${TAG_NAME}" \
              dist/*.whl dist/*.tar.gz \
              --title "${TAG_NAME}" \
              --draft \
              --notes "_Draft — release notes not yet written, do not publish as-is._

          A \`${TAG_NAME}\` tag was pushed with no release written for it. The artifacts here
          were built and verified by \`.github/workflows/release.yml\` and attached
          automatically, but the notes are authored by hand — see the previous releases for the
          form. Replace this text, then publish.

          If this tag was pushed by mistake, delete the tag and this draft." \
              --verify-tag
          fi
