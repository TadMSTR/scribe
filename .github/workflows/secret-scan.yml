# Secret scanning — B14.
#
# TWO TRIGGERS, TWO DIFFERENT JOBS TO DO, and the second is the one usually dropped:
#
#   push / pull_request — gate the incoming change.
#   schedule — scan FULL HISTORY. This needs fetch-depth: 0. A shallow checkout scans one
#     commit, which passes trivially and says nothing about the other fifty. A credential
#     in public history survives deletion of the commit that introduced it, so the tip
#     being clean is not the question. This repository is private today and intended to go
#     public after a secrets review, which makes history the thing that matters most.
#
# fetch-depth: 0 is set unconditionally rather than per-trigger — the gating run is cheap
# at this repo size, and a depth that depends on the trigger is one edit away from being
# wrong in the direction that fails silently.

name: Secret scan

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 06:23 UTC. Off the hour deliberately — scheduled jobs at :00 queue
    # behind everyone else's.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Full history. The tip being clean says nothing about history, and a
          # credential in public history survives deletion of the commit that
          # introduced it. Comment kept on its own line: repo-conform's B14 check
          # anchors `fetch-depth:\s*0\s*$` to end-of-line, so an inline comment here
          # reads as a shallow checkout (see vikunja ticket filed 2026-09-13).
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      # Pinned version, and installed here rather than assumed present. gitleaks happens
      # to be on the forge host this repo is developed on, which is exactly how a job
      # picks up an undeclared dependency and stops being reproducible on a clean runner.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # BEFORE the clean result is believed. "no leaks found" is what a working gate
      # reports on a clean tree and what a broken one reports on any tree at all. This
      # repository allowlists synthetic credentials by marker, so one of these checks
      # asserts the allowlist does not also excuse a real one.
      - name: Prove the gate fires on a planted secret
        run: python tests/check_gitleaks_gate.py

      - name: Scan full history
        run: gitleaks detect --source . --redact --config .gitleaks.toml
