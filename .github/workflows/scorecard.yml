# OSSF Scorecard: supply-chain risk scoring.
#
# The Action is free for public repositories; a private one needs GitHub Advanced Security.
# Like codeql.yml, this was added in a draft PR and merged after the visibility flip.
#
# TREAT THE SCORE AS A MEASUREMENT, NOT A TARGET. Several checks assess things this repository
# deliberately does not do (signed releases, multi-reviewer branch protection on a
# single-maintainer project), and chasing the number would mean adopting process for the sake
# of a metric. What it is good at is catching regressions we do care about: an unpinned action
# appearing, a dependency update path going stale, a token gaining scope it does not need.
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly, offset from codeql.yml so the two do not contend.
    - cron: "47 5 * * 0"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to the Security tab.
      security-events: write
      # Needed by publish_results: the action exchanges this for an OIDC token so the public
      # API can attest the result came from this repository rather than being self-reported.
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the public OpenSSF API, so anyone evaluating the project can see the
          # score without running Scorecard themselves.
          publish_results: true

      # Kept separately from the SARIF upload because the Security tab keeps only the latest
      # result, and comparing two runs is how you tell a real regression from a check whose
      # scoring changed upstream. Same pin as release.yml: Dependabot here ignores majors, so
      # a second major version of this action would never converge with the first.
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: results.sarif
